name: gemma4_12b_awq
description: Gemma 4 12B AWQ multimodal model on vLLM
executable: /shared/eve/vllm/.venv-omni/bin/vllm
args:
  - serve
  - mattbucci/gemma-4-12B-AWQ
  - --max-model-len
  - auto
  - --gpu-memory-utilization
  - "0.98"
  - --kv-cache-dtype
  - fp8
  - --max-num-seqs
  - "1"
  - --enable-prefix-caching
  - --chat-template
  - /shared/eve/vllm/examples/tool_chat_template_gemma4.jinja
  - --enable-auto-tool-choice
  - --tool-call-parser
  - gemma4
  - --reasoning-parser
  - gemma4
  - --structured-outputs-config
  - '{"backend":"xgrammar","disable_any_whitespace":true}'
  - --trust-remote-code
served_model_name: gemma4-12b-awq
litellm_model: openai/gemma4-12b-awq
aliases:
  - gemma4-12b-awq
  - gemma-4-12b-awq
  - gemma4-12b
  - gemma-4-12b
  - gamma4-12b
  - gemma4
  - mattbucci/gemma-4-12B-AWQ
cache_paths:
  - /shared/eve/huggingface/hub/models--mattbucci--gemma-4-12B-AWQ
env:
  HF_HOME: /shared/eve/huggingface
  HUGGINGFACE_HUB_CACHE: /shared/eve/huggingface/hub
  HF_XET_CACHE: /shared/eve/huggingface/xet
  VLLM_CACHE_ROOT: /shared/eve/vllm-cache
  XDG_CACHE_HOME: /shared/eve/.cache
  HF_XET_HIGH_PERFORMANCE: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  VLLM_ENFORCE_STRICT_TOOL_CALLING: "0"

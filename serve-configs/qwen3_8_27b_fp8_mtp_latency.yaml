# Qwen3.8-27B-INT4 on 4x L4 - THE prod profile (single profile since 2026-08-21).
#
# 2026-08-21: the separate throughput profile (qwen3_8_27b_fp8_max.yaml, V1
# runner, no MTP, "DBO") is gone. Measured cold, like-for-like (vllm bench
# random 1024/1024, 128 prompts, fresh server each): this profile c1 110 /
# c32 682 / c64 821 / c128 915 tok/s vs that profile c64 878 - and its
# 1100/1298 at c64/c128 from 2026-08-20 were prefix-cache-warm (26-52% hits:
# c32->c64->c128 ran back-to-back on one server with seeded prompts). DBO
# never engaged there (dbo-decode-token-threshold 1e6) and cannot on this
# model ("UBatching not supported with GDN or linear attn"). Profiler traces
# at batch 64 and 128 show the V1 and V2 runners identical per step (53 / 87
# ms, GPU 99%, same kernel mix). What makes one profile possible: patch 0015
# (GDN spec state slots follow the per-step draft count) and 0016 (no
# drafter forward on zero-draft steps), mamba-ssm-cache-dtype float16 (also
# +8% single-stream), 128 seqs, gpu-mem 0.88 (0.92+ OOMs capturing the
# 128-wide MTP graphs).
#
# 2026-08-17: K raised 2 -> 7 for <=8 seqs (K=2 for 9-32, off above). With
# draft_tensor_parallel_size=1 + local argmax the sequential MTP head is cheap
# enough that deeper drafts pay even at 30% position-6 acceptance
# ("tokens per pass" is the dial, not acceptance rate). Measured single-stream
# (768-tok greedy) K=2 -> K=7: code-edit 55 -> 103 tok/s (7.8 tok/pass),
# code-write 48-52 -> 69, reasoning 46 -> 42-50, prose 39-42 -> 38-40.
# K=10: edit 107, reasoning 55-59, but prose 30 and write 63 -> not chosen.
# This matches the DSpark drafter (serve-configs/qwen3_8_27b_fp8_dspark_code.yaml)
# on code and beats it on prose with NO KV-pool cost (DSpark halves the pool).
#
# Serve:
#   HF_HOME=/data/huggingface HF_HUB_OFFLINE=1 PYTHONHASHSEED=8012 \
#     /shared/vllm/.venv-qwen38/bin/vllm serve \
#     --config /shared/vllm/serve-configs/qwen3_8_27b_fp8_mtp_latency.yaml
#
# Measured 2026-08-16 (128x1k/1k aggregate; single-stream 512-tok greedy):
#   single-stream: 26.7 -> 39.4 tok/s prose (+47%), 49.8 code (+87%);
#     draft acceptance 81%/59% at pos 0/1 (~2.4 tok/engine step)
#   aggregate: 476.7 tok/s (TP4 no-MTP control) -> 424.7 (-11%)
# How the aggregate cost got from -35% to -11%: profiling showed the 1-layer
# draft head at TP4 added ~4k extra NCCL all-reduces (~10.7 ms each on PCIe)
# per prefill window. draft_tensor_parallel_size=1 runs the head unsharded on
# every rank (no draft all-reduce); use_local_argmax_reduction drops the
# vocab all-gather. The remaining -11% was the draft forward that vLLM ran
# even at K=0 to keep the draft KV in sync; patch 0016 (`lazy_draft`) skips
# it on zero-draft steps (measured c64: 786 -> ~946 tok/s ceiling), at the
# price that a request which lived through a wide batch does not speculate
# again and the blocks it made are recomputed by the next drafting request.
# num_speculative_tokens_per_batch_size: K=7 up to 16 seqs, off above.
# Measured 2026-08-21 (INT4, effort v3, random 1024/512, K=7-always vs
# MTP-off): c1 102 vs 51, c4 212 vs 164, c8 304 vs 267, c16 388 vs 381,
# c24 382 vs 430, c32 384 vs 481 tok/s - verify cost overtakes the draft win
# at c16 (random prompts accept poorly; on code the knee is a little higher,
# so 16 is the conservative cut). Draft counters freeze above the cut, so
# heavy batches pay only the K=0 floor above.
# Patch 0015: the GDN state slots follow that schedule too. Each draft token
# needs its own copy of the recurrent state (48 layers x 48x128x128 fp32
# = 151 MB), and stock vLLM reserves num_speculative_tokens of them per
# request for its whole life - 9 copies, 1.36 GB, ~35k KV-token-equivalents,
# which capped this profile at ~39 concurrent requests (c64: 206 tok/s, 139
# preemptions, 2026-08-21). Now a request holds slots for the drafts it
# actually verifies this step (released two steps after the last draft that
# needed them), so MTP costs no state memory where the schedule turns it off.
#
# Tiered KV offload ENABLED — requires the venv-local patch
# artifacts/offload-debug/mtp-eagle-group-detection.patch (offloading
# connector scheduler.py): stock nightly marks ALL KV groups EAGLE-volatile
# when MTP is on (no group carries is_eagle_group), so restore lookups never
# converge and every resume full-recomputes. Patch detects the draft tower by
# its "mtp" layer prefix (group [3] only). Verified on this config: 32k resume
# after eviction 20.6 s -> 2.1 s, after service restart (disk tier) -> 3.1 s,
# output byte-identical to cold. A venv rebuild loses this AND the two
# pin_mmap_region patches (see qwen3_8_27b_fp8_max.yaml).
#
# NCCL P2P + Triton attention (2026-08-18): the unit sets NCCL_P2P_LEVEL=SYS
# (needs IOMMU off + ACS cleared on the host; 4-way all-reduce 25.9 -> 11.7 ms,
# cold 90k prefill 61 -> 42 s, plain TP4 aggregate 477 -> 620 tok/s, single-
# stream reason/prose/write/edit 46/40/68/103 -> 51/42/81/115). With P2P the
# FlashInfer backend faults (illegal memory access; GPU core dump names
# flashinfer::PersistentVariableLengthMergeStatesKernel) on the spec-decode
# verify path — a FlashInfer race exposed by faster all-reduces — so both the
# target and the MTP draft run TRITON_ATTN. Never mix P2P with FLASHINFER here.
#
# Keep-alive middleware (serve-configs/middleware/vllm_keepalive.py, needs that
# dir on PYTHONPATH): Cloudflare returns 524 when the origin sends no response
# BYTES for 100 s, streaming or not (verified through the tunnel: 524 at 125 s
# on a streaming request with a 130 s TTFT). A ~200k-token uncached prompt
# takes 130-150 s to prefill on 4x L4, so agent compaction calls died at the
# edge and were retried in loops. The middleware emits SSE comments / JSON
# leading whitespace while the engine works; every client parser ignores them.
#
# Speculative-decoding settings (venv patch serve-configs/patches/0005):
#   adaptive_draft_length + adaptive_draft_margin 2.0: the scheduler keeps a
#     per-request EMA of accepted draft tokens and drafts ceil(ema+margin)
#     tokens (capped by the batch-size schedule) instead of always K. Each MTP
#     draft step is memory-bound (draft layer + lm_head read), so prompts that
#     rarely accept deep drafts (prose, reasoning) stop paying for them; margin
#     2 keeps code drafts near K (margin 1 starved code-write, 3 gained nothing).
#   draft_lm_head_dtype int4: the drafter reads a Marlin group-128 copy of the
#     bf16 target lm_head shard for its argmax; the target verifies with its
#     own bf16 head, so the target distribution is untouched (fp8 is the other
#     option; int4 is faster on L4 and costs ~1% acceptance). Token-level
#     outputs still differ from the previous config at numeric near-ties, as
#     between any two kernel paths: per-token logprob agreement with the old
#     config is at the noise floor of vLLM's own config variation (run
#     artifacts logprob-agreement-*.log).
#   draft_tensor_parallel_size is ignored for MTP (the eagle path uses the
#     target TP group); it stays for documentation only.
# Model Runner V2 (unit sets VLLM_USE_V2_MODEL_RUNNER=1): full CUDA graphs and
# a fused multi-step draft graph. The eager GDN op otherwise costs ~0.6 ms CPU
# per call (48/step) and desyncs the TP ranks. V2's graphs take ~1.6 GiB, so
# gpu-memory-utilization is 0.92 (0.94 OOMs on a 200k prefill).
#   additional-config lm_head_dtype fp8 (venv patch 0008): the target verifies
#     with a per-channel fp8 copy of its lm_head (CUTLASS W8A8, dynamic
#     per-token activation scale). Per-token logprob agreement with the bf16
#     head: mean |dlogprob| 0.035, top-1 2.5% - below the kernel-path noise
#     floor (0.076 / 3.2%) - for -1 ms per verify step. int4 is not used for
#     the target.
#   in_proj_ba skinny GEMM (venv patch 0007): cuBLAS spends 27 us per layer on
#     the bf16 [8 x 5120] x [5120 x 24] gate projection at decode; a split-K
#     Triton kernel takes 5.5 us (48 layers -> -1 ms/step).
# Observability: draft length is visible as spec_decode_num_draft_tokens_total
# / spec_decode_num_drafts_total (mean K) and the per-position acceptance
# counters vLLM already exports.
# Measurements and rejected alternatives: goal run
# goal/sessions/23cb78c0-b3a1-4ea3-89e2-332443ff1f8f/runs/20260818T055754Z-8dd3de85.
# 2026-08-20: INT4 swap (RedHatAI GPTQ/AWQ W4A16 g128, Marlin on SM89). Arm-benched
# like-for-like vs the FP8 hardware-limit numbers: single-stream reason/prose/
# write/edit 66/65/105/160 -> ~100/88/147/207 tok/s; KV pool 1.39M -> 1.72M (0.92
# util); MTP drafter + int4 draft head + fp8 target lm_head unchanged (tok/pass
# 7.8 on edit); VulcanBench v3 greedy dynamic 20/23 vs FP8 19/23 @ ~equal tokens.
model: RedHatAI/Qwen3.8-27B-INT4
tensor-parallel-size: 4
max-model-len: 262144
kv-cache-dtype: fp8
gpu-memory-utilization: 0.88
max-num-seqs: 128
max-num-batched-tokens: 8192
mamba-ssm-cache-dtype: float16
compilation-config: '{"max_cudagraph_capture_size": 128}'
speculative-config: '{"method": "qwen3_5_mtp", "num_speculative_tokens": 7, "attention_backend": "TRITON_ATTN", "draft_tensor_parallel_size": 1, "use_local_argmax_reduction": true, "lazy_draft": true, "adaptive_draft_length": true, "adaptive_draft_margin": 2.0, "draft_lm_head_dtype": "int4", "num_speculative_tokens_per_batch_size": [[1, 16, 7], [17, 32, 2], [33, 128, 0]]}'
kv-transfer-config: '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":25769803776,"secondary_tiers":[{"type":"fs","root_dir":"/data/kv-offload/qwen38"}]}}'
reasoning-parser: qwen3
# Dynamic reasoning effort v3 (venv patch 0009, docs/dynamic-reasoning.claude.md
# §13; results in docs/dynamic-reasoning-v3-results.md). The v1 rung ladder and
# the v2 rank rule / soft-limit close were removed on 2026-08-21; this is the
# only dynamic-effort implementation in the tree.
#
# `reasoning_effort: "dynamic"` gives a request one effort LEVEL before it
# thinks and renders that level's sentence at the TRUE TAIL of the prompt (a
# trailing user message, after the last turn - measured on this box: with the
# sentence on the last *user* message of an agent turn the xhigh wording moves
# reasoning length 1.14x, at the tail 1.23x up and 0.78x down, because a tool
# result otherwise sits between it and the generation point). The level comes
# from the prompt body's own last prefill row - the vector lm_head consumes,
# computed anyway - matched by cosine against an online memory this server
# fills from its own finished requests: key = pooled state, value = the
# reasoning tokens that request spent at a natural close. An asymmetric
# quantile map over running digests picks the level: it raises freely and
# lowers only when both confidence gates agree (novelty: nothing similar in the
# memory; spread: the neighbours disagree), because one under-thought step can
# kill a trajectory while over-thinking only costs tokens.
#
# There is NO thinking cap on this path: no ladder, no mid-generation
# escalation, no soft-limit ramp, no forced close. The model closes its own
# think block (close_kind=natural) or the client's max_tokens / a timeout ends
# it (close_kind=client-limit, not valued in the memory). Nothing is trained and
# there is no offline corpus: a cold memory, a missing vector or a prompt with
# no usable seam all render the default level with a byte-identical prompt.
# default_level 1 (medium) is the prior for every undecided request - cold
# memory, no seam, novel prompt. With the prior at 0 (low), VulcanBench
# flask (2026-08-21, two seeds) ran the whole task at low and missed the
# aggregation test both times (693 / 143k reasoning tokens, max level 0)
# where the v1 ladder had passed by escalating on 6 requests. The asymmetric
# map lowers from the middle only when the neighbours agree; it should not
# start at the bottom.
# default_effort: a request that OMITS reasoning_effort is routed instead of
# falling through to the chat template's own default, which for Qwen3.8 is
# xhigh - the most expensive level there is. An explicit level (including
# "none") is never overridden. The throughput profile uses the same setup with
# its own memory file. Per-request telemetry (VLLM_EFFORT_TELEMETRY, drop-in
# effort-telemetry.conf): per-step entropy/margin rows plus one `event: finish`
# record with requested vs effective effort and this report
# (level, decided, reasoning_tokens, close_kind, memory_entries, neighbours).
reasoning-config: '{"dynamic_effort": {"default_effort": "dynamic", "hidden_effort": {"enabled": true, "default_level": 1, "memory_path": "/data/effort-memory/qwen38-latency.npz"}}}'
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
served-model-name: Qwen3.8-27B
attention-backend: TRITON_ATTN
additional-config: '{"lm_head_dtype": "fp8"}'
port: 8012
middleware: ["vllm_keepalive.KeepAliveMiddleware"]

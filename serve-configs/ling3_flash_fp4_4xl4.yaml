# TP4 is impossible for this checkpoint: the shared-expert MLP (768 wide,
# fp8 128x128 block quant) shards to 192/rank at TP4, indivisible by the
# 128 block (vendor reference deploy is TP2 on Blackwell for this reason).
# TP2 x PP2 uses all 4 GPUs with legal 384-wide shards.
tensor-parallel-size: 2
pipeline-parallel-size: 2
# REQUIRED on L4: without EP, TP4 shards moe_intermediate_size 768 -> 192
# per rank, and the Marlin mxfp4 backend rounds that up to 256
# (oracle/mxfp4.py mxfp4_round_up_hidden_size_and_intermediate_size,
# 128-multiple), inflating the ~16 GB/GPU routed-expert weights by 33%
# -> guaranteed OOM on 22.5 GiB cards. With EP the experts are split by
# count (512/4 = 128 per rank) at full intermediate 768 (already
# 128-aligned) and hidden 2560 (256-aligned): zero padding. Comm falls
# back to the naive all2all on L4 (no DeepEP/pplx) which is fine at this
# scale. If the EP path misbehaves with this fork, the no-padding
# alternative is dropping EP and pinning moe-backend: triton_unfused
# (64-round-up keeps 192) — but that kernel is flagged buggy with MTP.
enable-expert-parallel: true
# 42 layers = 35 KDA + 7 gated MLA (5:1). Only the 7 MLA layers allocate
# paged KV (latent kv_lora_rank 512 + 64 rope dims ~= 1.15 KB/layer/token
# bf16, replicated per rank under MLA) -> ~8 KB/token, ~0.5 GiB at 64k.
# KDA layers keep constant-size recurrent state per sequence (scales with
# max-num-seqs, not context), so raising context is cheap KV-wise:
# 65536 for the smoke; step 131072 -> 262144 (card max, rope native 262144)
# once the smoke passes — at 256k paged KV is still only ~2 GiB/GPU.
max-model-len: 65536
# Weights ~17.6 GB/GPU of the L4's 22.5 GiB. 0.92 -> ~21.2 GB budget,
# leaving ~3.5 GB for KV + KDA state pool + activations. The card's 0.85
# would leave <3 GB and risks failing the KV-cache memory check.
gpu-memory-utilization: 0.92
# Bound the KDA/mamba-style state pool: state is per-sequence constant, so
# max-num-seqs directly sizes that pool. 8 is plenty for the coding eval
# (sequential requests); raise only after checking free KV memory at startup.
max-num-seqs: 8
# Chunked-prefill size; matches the vendor's 8192 chunk recipe. Lower to
# 4096 if activation memory OOMs during long-prompt prefill.
max-num-batched-tokens: 8192
# First smoke run: skip CUDA graph capture — avoids capture-time OOM on the
# ~3 GB headroom and any hybrid KDA+MLA capture bugs in the fork. Remove
# (or set false) once stable; graphs matter for KDA decode throughput.
enforce-eager: true
# Card-recommended runtime flags (fork-specific):
# mamba-cache-mode align — KDA state cache layout required by the fork.
mamba-cache-mode: align
enable-prefix-caching: true
# ling3 parsers ship in the fork; thinking mode is on by default in the
# chat template (disable per-request via chat_template_kwargs.enable_thinking).
reasoning-parser: ling3
enable-auto-tool-choice: true
tool-call-parser: ling3
served-model-name: Ling-3.0-flash-fp4
port: 8011
# MoE kernel: auto-selection on SM89 falls through TRTLLM/DeepGEMM (both
# SM90/100-gated) to MARLIN, so no pin is needed; if selection misbehaves,
# pin explicitly with:
# moe-backend: marlin
# --- Deliberately omitted for the smoke, restore later ---
# speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
#   Card recommends MTP spec decode (model trained with MTP); costs extra
#   weight+state memory per rank, so enable only after the smoke fits.
# kv-cache-dtype: fp8
#   Optional headroom lever for 256k; verify fp8 MLA KV path on SM89 first.
#
# Sampling defaults per model card: temperature 0.6, top_p 0.95, top_k 20
# (client-side; see scripts/ling3_coding_eval.py).

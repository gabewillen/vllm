# Ling-3.0-flash-fp4 (inclusionAI, official MXFP4-expert/FP8-dense quant)
# on 4x L4 23 GiB — 64k smoke config.
#
# Serve (uses the vllm-ling-v3 fork venv, NOT the repo .venv):
#   HF_HOME=/data/huggingface HF_HUB_OFFLINE=1 \
#     /shared/vllm/.venv-ling/bin/vllm serve \
#     --config /shared/vllm/serve-configs/ling3_flash_fp4_4xl4.yaml
#
# Fork: https://github.com/inclusionAI/vllm-ling-v3 branch ling_3_0
# (installed editable from /data/src/vllm-ling-v3 into /shared/vllm/.venv-ling).
# Model card's reference serve flags (141 GB-class GPUs) adapted for L4:
# card uses --gpu-memory-utilization 0.85 + MTP spec decode; we tighten/omit
# those because weights alone are ~17.6 GB/GPU here (70.4 GB checkpoint / TP4).
model: inclusionAI/Ling-3.0-flash-fp4
# Custom BailingMoeV3 config/modeling files live in the checkpoint repo.
trust-remote-code: true
# REQUIRED for this checkpoint on the vLLM fork: the fp4 card only documents
# SGLang; the fork's Fp8Config routes routed experts to Mxfp4MoEMethod only
# when quantization_config.store_dtype == "mxfp4" (fp8.py get_quant_method),
# but this checkpoint spells it "routed_experts_quant_method": "mxfp4"
# instead, which nothing in the fork reads. Without this override the fp8
# MoE loader hits e2m1-packed uint8 expert tensors and fails.
# Dict-valued hf-overrides REPLACE the attr wholesale (_apply_dict_overrides
# only recurses into nested PretrainedConfig, and quantization_config is a
# plain dict), so the full original dict is reproduced here verbatim from
# the checkpoint config.json with only store_dtype added.
hf-overrides:
  quantization_config:
    activation_scheme: dynamic
    fmt: e4m3
    quant_method: fp8
    scale_fmt: ue8m0
    weight_block_size: [128, 128]
    store_dtype: mxfp4            # <- the one added key
    routed_experts_quant_method: mxfp4
    routed_experts_group_size: 32
    routed_experts_scale_dtype: e8m0
    routed_experts_weight_dtype: e2m1
    routed_experts_source_quant_method: fp8_block_128x128
    # Full module prefixes generated from the checkpoint tensor
    # inventory (fork matches exact prefixes, not substrings; the
    # vendor list used SGLang-style bare names that never match).
    # 35 KDA qkvb+convs, 7 MLA fused_qkv_a/g/kv_b, 40 router
    # gates, lm_head = 202 entries.
    modules_to_not_convert:
      - lm_head
